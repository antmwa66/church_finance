{% extends "base.html" %}
{% block title %}Create Local Pastor - Church Finance{% endblock %}
{% block content %}
<h2>Create Local Pastor</h2>
<form method="POST" action="{{ url_for('subregion_create_pastor') }}" class="form-card">
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Enter username">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
    </div>
    <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required placeholder="Enter full name">
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email">
    </div>
    <div class="form-group">
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" placeholder="Enter phone number">
    </div>
    <div class="form-group">
        <label for="church_id">Church</label>
        <select id="church_id" name="church_id" required>
            <option value="">-- Select Church --</option>
            {% for church in churches %}
            <option value="{{ church.id }}">{{ church.name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Create Pastor</button>
    <a href="{{ url_for('subregion_dashboard') }}" class="btn btn-secondary">Back</a>
</form>
{% endblock %}
