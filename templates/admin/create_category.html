{% extends "base.html" %}
{% block title %}Create Payment Category - Church Finance{% endblock %}
{% block content %}
<h2>Create Payment Category</h2>
<form method="POST" action="{{ url_for('admin_create_category') }}" class="form-card">
    <div class="form-group">
        <label for="name">Category Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g., Tithe, Mission, Bills, Church Construction">
    </div>
    <div class="form-group">
        <label for="description">Description (Optional)</label>
        <textarea id="description" name="description" rows="3" placeholder="Brief description of this category"></textarea>
    </div>
    <button type="submit" class="btn btn-primary">Create Category</button>
    <a href="{{ url_for('admin_categories') }}" class="btn btn-secondary">Back</a>
</form>
{% endblock %}
