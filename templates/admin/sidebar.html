{% block sidebar %}
<div class="menu-section-header">Management</div>
<a href="{{ url_for('admin_manage_regions') }}" class="nav-item {% if request.endpoint in ['admin_manage_regions'] %}active{% endif %}">
    <span class="nav-icon">🌍</span>
    <span class="nav-label">Regions</span>
</a>
<a href="{{ url_for('admin_manage_bishops') }}" class="nav-item {% if request.endpoint in ['admin_manage_bishops','admin_transfer_bishop'] %}active{% endif %}">
    <span class="nav-icon">👔</span>
    <span class="nav-label">Regional Bishops</span>
</a>
<a href="{{ url_for('admin_manage_sub_bishops') }}" class="nav-item {% if request.endpoint == 'admin_manage_sub_bishops' %}active{% endif %}">
    <span class="nav-icon">📋</span>
    <span class="nav-label">Sub-Region Bishops</span>
</a>
<a href="{{ url_for('admin_manage_pastors') }}" class="nav-item {% if request.endpoint == 'admin_manage_pastors' %}active{% endif %}">
    <span class="nav-icon">⛪</span>
    <span class="nav-label">Local Pastors</span>
</a>
<a href="{{ url_for('admin_create_region') }}" class="nav-item {% if request.endpoint == 'admin_create_region' %}active{% endif %}">
    <span class="nav-icon">➕</span>
    <span class="nav-label">Create Region</span>
</a>
<a href="{{ url_for('admin_create_bishop') }}" class="nav-item {% if request.endpoint == 'admin_create_bishop' %}active{% endif %}">
    <span class="nav-icon">➕</span>
    <span class="nav-label">Create Bishop</span>
</a>
<div class="menu-section-header">Settings</div>
<a href="{{ url_for('admin_categories') }}" class="nav-item {% if request.endpoint in ['admin_categories','admin_create_category','admin_toggle_category'] %}active{% endif %}">
    <span class="nav-icon">🏷️</span>
    <span class="nav-label">Categories</span>
</a>
<div class="menu-section-header">Finance</div>
<a href="{{ url_for('admin_allocations') }}" class="nav-item {% if request.endpoint in ['admin_allocations','admin_create_allocation'] %}active{% endif %}">
    <span class="nav-icon">🧮</span>
    <span class="nav-label">Fund Allocations</span>
</a>
<a href="{{ url_for('admin_payments') }}" class="nav-item {% if request.endpoint == 'admin_payments' %}active{% endif %}">
    <span class="nav-icon">💳</span>
    <span class="nav-label">All Payments</span>
</a>
<a href="{{ url_for('admin_accumulative') }}" class="nav-item {% if request.endpoint in ['admin_accumulative','admin_payments_by_category_detail'] %}active{% endif %}">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Accumulative Report</span>
</a>
<a href="{{ url_for('admin_regions_report') }}" class="nav-item {% if request.endpoint == 'admin_regions_report' %}active{% endif %}">
    <span class="nav-icon">📄</span>
    <span class="nav-label">Regional PDF Report</span>
</a>
<div style="padding: 10px; margin: 5px 0; background: #f5f5f5; border-radius: 4px;">
    <small style="color: #666;">Filter by %:</small>
    <form action="{{ url_for('admin_regions_report') }}" method="GET" style="margin-top: 5px;">
        <input type="number" name="min_percentage" placeholder="Min %" step="0.1" style="width: 100%; margin-bottom: 5px; padding: 5px; border: 1px solid #ddd; border-radius: 3px;">
        <input type="number" name="max_percentage" placeholder="Max %" step="0.1" style="width: 100%; margin-bottom: 5px; padding: 5px; border: 1px solid #ddd; border-radius: 3px;">
        <button type="submit" style="width: 100%; padding: 8px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">Generate</button>
    </form>
</div>
{% endblock %}
