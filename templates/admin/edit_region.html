{% extends "base.html" %}
{% block title %}Edit Region - Church Finance{% endblock %}
{% block content %}
<h2>Edit Region</h2>
<form method="POST" action="{{ url_for('admin_edit_region', region_id=region.id) }}" class="form-card">
    <div class="form-group">
        <label for="name">Region Name</label>
        <input type="text" id="name" name="name" required value="{{ region.name }}" placeholder="e.g., Nairobi Region">
    </div>
    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('admin_manage_regions') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
