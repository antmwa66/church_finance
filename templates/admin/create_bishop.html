{% extends "base.html" %}
{% block title %}Create Regional Bishop - Church Finance{% endblock %}
{% block content %}
<h2>Create Regional Bishop</h2>
<form method="POST" action="{{ url_for('admin_create_bishop') }}" class="form-card">
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Enter username">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
    </div>
    <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required placeholder="Enter full name">
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email">
    </div>
    <div class="form-group">
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" placeholder="Enter phone number">
    </div>
    <div class="form-group">
        <label for="region_id">Region</label>
        <select id="region_id" name="region_id" required>
            <option value="">-- Select Region --</option>
            {% for region in regions %}
            <option value="{{ region.id }}">{{ region.name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Create Bishop</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back</a>
</form>
{% endblock %}
