{% extends "base.html" %}
{% block title %}Create Region - Church Finance{% endblock %}
{% block content %}
<h2>Create Region</h2>
<form method="POST" action="{{ url_for('admin_create_region') }}" class="form-card">
    <div class="form-group">
        <label for="name">Region Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g., Nairobi Region">
    </div>
    <button type="submit" class="btn btn-primary">Create Region</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Back</a>
</form>
{% endblock %}
