{% block sidebar %}
<div class="menu-section-header">Finance</div>
<a href="{{ url_for('pastor_allocations') }}" class="nav-item {% if request.endpoint == 'pastor_allocations' %}active{% endif %}">
    <span class="nav-icon">🧮</span>
    <span class="nav-label">Fund Allocations</span>
</a>
<a href="{{ url_for('pastor_make_payment') }}" class="nav-item {% if request.endpoint == 'pastor_make_payment' %}active{% endif %}">
    <span class="nav-icon">💳</span>
    <span class="nav-label">Make Payment</span>
</a>
<a href="{{ url_for('pastor_my_payments') }}" class="nav-item {% if request.endpoint in ['pastor_my_payments','pastor_payment_detail'] %}active{% endif %}">
    <span class="nav-icon">📋</span>
    <span class="nav-label">My Payments</span>
</a>
<div class="menu-section-header">Settings</div>
<a href="{{ url_for('change_password') }}" class="nav-item {% if request.endpoint == 'change_password' %}active{% endif %}">
    <span class="nav-icon">🔒</span>
    <span class="nav-label">Change Password</span>
</a>
{% endblock %}
