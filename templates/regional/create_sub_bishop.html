{% extends "base.html" %}
{% block title %}Create Sub-Region Bishop - Church Finance{% endblock %}
{% block content %}
<h2>Create Sub-Region Bishop</h2>
<form method="POST" action="{{ url_for('regional_create_sub_bishop') }}" class="form-card">
    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required placeholder="Enter username">
    </div>
    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter password">
    </div>
    <div class="form-group">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" required placeholder="Enter full name">
    </div>
    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email">
    </div>
    <div class="form-group">
        <label for="phone">Phone</label>
        <input type="text" id="phone" name="phone" placeholder="Enter phone number">
    </div>
    <div class="form-group">
        <label for="sub_region_id">Sub-Region</label>
        <select id="sub_region_id" name="sub_region_id" required>
            <option value="">-- Select Sub-Region --</option>
            {% for sr in sub_regions %}
            <option value="{{ sr.id }}">{{ sr.name }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Create Sub-Region Bishop</button>
    <a href="{{ url_for('regional_dashboard') }}" class="btn btn-secondary">Back</a>
</form>
{% endblock %}
