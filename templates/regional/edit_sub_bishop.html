{% extends "base.html" %}
{% block title %}Edit Sub-Region Bishop - Church Finance{% endblock %}
{% block content %}
<h2>Edit Sub-Region Bishop</h2>
<div class="form-container">
    <form method="POST" action="{{ url_for('regional_edit_sub_bishop', sub_bishop_id=sub_bishop.id) }}">
        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" id="full_name" name="full_name" value="{{ sub_bishop.full_name }}" required autofocus>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" value="{{ sub_bishop.email or '' }}">
        </div>
        <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" name="phone" value="{{ sub_bishop.phone or '' }}">
        </div>
        <div class="form-group">
            <label for="sub_region_id">Sub-Region</label>
            <select id="sub_region_id" name="sub_region_id" required>
                {% for sr in sub_regions %}
                <option value="{{ sr.id }}" {% if sub_bishop.sub_region_id == sr.id %}selected{% endif %}>{{ sr.name }}</option>
                {% endfor %}
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Update Bishop</button>
        <a href="{{ url_for('regional_manage_sub_bishops') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
